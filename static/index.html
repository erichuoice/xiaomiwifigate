<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="上网答题">
<meta name="theme-color" content="#f6f7f9">
<title>上网先答题</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --line: #e2e6ea;
    --text: #171b21;
    --muted: #6b7280;
    --accent: #1a6fd4;
    --accent-soft: #eaf2fd;
    --ok: #0f7a5a;
    --ok-bg: #e4f6ee;
    --no: #b03030;
    --no-bg: #fdeaea;
    --star: #d99a2b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px 16px 40px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 14px; }

  .status {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--muted);
  }
  .status b { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
  .status .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent);
  }
  .status .pill.off { background: #f0f2f5; color: var(--muted); }

  .progress { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .dot {
    width: 26px; height: 6px; border-radius: 3px; background: #dfe4ea; flex: 0 0 auto;
    transition: background .2s;
  }
  .dot.now { background: var(--accent); }
  .dot.ok { background: var(--ok); }
  .dot.no { background: var(--no); }
  .pcount { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
  }
  .ptitle { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .pdesc { font-size: 13px; color: var(--muted); margin: 0 0 12px; }

  .tier {
    display: flex; align-items: center; gap: 12px; width: 100%;
    border: 1.5px solid var(--line); border-radius: 13px; background: #fff;
    padding: 13px 14px; margin-bottom: 10px; cursor: pointer; text-align: left;
    font-family: inherit; color: var(--text);
  }
  .tier:last-child { margin-bottom: 0; }
  .tier:active, .tier.on { border-color: var(--accent); background: var(--accent-soft); }
  .tier .num {
    flex: 0 0 auto; min-width: 52px; text-align: center;
    font-size: 20px; font-weight: 700; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .tier .num small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .tier .txt { flex: 1; }
  .tier .txt b { font-size: 15.5px; }
  .tier .txt span { display: block; font-size: 12.5px; color: var(--muted); }
  .tier .go { flex: 0 0 auto; font-size: 13px; color: var(--accent); font-weight: 600; }

  .tlabel {
    font-size: 12.5px; color: var(--muted); margin: 16px 0 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .tlabel::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .devrow { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .dev {
    border: 1.5px solid var(--line); background: #fff; color: var(--text);
    border-radius: 999px; padding: 8px 14px; font-size: 13.5px; cursor: pointer;
    font-family: inherit; width: auto; font-weight: 500;
  }
  .dev.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .dev small { color: var(--muted); font-size: 11.5px; margin-left: 4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: var(--accent-soft); color: var(--accent);
  }
  .chip.plain { background: #f0f2f5; color: var(--muted); }
  .chip.star { background: #fdf3e2; color: #8a5a00; letter-spacing: 1px; }

  .qtext { font-size: 18px; font-weight: 600; line-height: 1.55; margin-bottom: 16px; white-space: pre-wrap; }

  .opt {
    display: flex; align-items: center; gap: 12px;
    border: 1.5px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; background: #fff;
    cursor: pointer; min-height: 54px; transition: border-color .15s, background .15s;
  }
  .opt:last-child { margin-bottom: 0; }
  .opt .mark {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%;
    border: 1.5px solid #c9d0d8; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
  }
  .opt .label { flex: 1; font-size: 16px; }
  .opt.picked { border-color: var(--accent); background: var(--accent-soft); }
  .opt.picked .mark { border-color: var(--accent); background: var(--accent); color: #fff; }
  .opt.correct { border-color: var(--ok); background: var(--ok-bg); }
  .opt.correct .mark { border-color: var(--ok); background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--no); background: var(--no-bg); }
  .opt.wrong .mark { border-color: var(--no); background: var(--no); color: #fff; }
  .opt.locked { cursor: default; }

  .feedback { display: none; margin-top: 16px; border-radius: 12px; padding: 13px 14px; font-size: 14px; }
  .feedback.on { display: block; }
  .feedback.ok { background: var(--ok-bg); color: #0a5b43; }
  .feedback.no { background: var(--no-bg); color: #8a2626; }
  .feedback b { display: block; font-size: 15px; margin-bottom: 3px; }
  .feedback p { margin: 0; opacity: .92; }

  button {
    width: 100%; border: 0; border-radius: 14px; padding: 16px;
    font-size: 17px; font-weight: 600; color: #fff; background: var(--accent);
    cursor: pointer; font-family: inherit;
  }
  button:disabled { background: #b9c0c9; }
  button.ghost { background: #e9edf2; color: var(--text); }

  .panel { border-radius: 16px; padding: 20px; margin-bottom: 16px; display: none; }
  .panel.ok { background: var(--ok-bg); border: 1px solid #7fc3a8; color: #08543e; }
  .panel.no { background: var(--no-bg); border: 1px solid #e0a0a0; color: #7d2020; }
  .panel.info { background: var(--card); border: 1px solid var(--line); color: var(--text); }
  .panel h2 { font-size: 19px; margin: 0 0 6px; }
  .panel p { margin: 0; font-size: 14px; line-height: 1.65; }
  .panel .big { font-size: 26px; font-weight: 700; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .panel .cd {
    display: inline-block; margin-top: 10px; padding: 9px 13px;
    border-radius: 10px; background: rgba(255, 255, 255, .72);
    border: 1px solid rgba(0, 0, 0, .07);
    font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .panel .cd b { font-size: 20px; letter-spacing: .5px; }
  .panel .cd.over { color: #7d2020; background: var(--no-bg); border-color: #e0a0a0; }

  .foot { color: var(--muted); font-size: 12.5px; margin-top: 20px; line-height: 1.8; }
  .foot code { background: #e6e9ed; padding: 1px 5px; border-radius: 4px; }
  .loading { color: var(--muted); font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">上网先答题</h1>
  <p class="sub" id="subtitle">答对题目，换这台设备的上网时间</p>

  <div class="status" id="status" style="display:none"></div>

  <div class="progress" id="progress" style="display:none"></div>
  <div id="result" class="panel"></div>

  <!-- 选档位 -->
  <div class="card" id="pick-card" style="display:none">
    <div class="ptitle" id="pick-title">选一个目标开始答题</div>
    <p class="pdesc" id="pick-desc">一轮全部答对才生效，答错一道要重来。</p>
    <div id="target-wrap" style="display:none">
      <div class="tlabel">为哪台设备解锁</div>
      <div class="devrow" id="targets"></div>
    </div>
    <div id="tiers"></div>
  </div>

  <!-- 答题 -->
  <div class="card" id="quiz-card">
    <div class="loading" id="loading">正在读取题目…</div>
    <div id="quiz" style="display:none">
      <div class="chips" id="chips"></div>
      <div class="qtext" id="qtext"></div>
      <div id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <button id="main" disabled style="display:none">确认答案</button>

  <div class="foot">
    <div id="devinfo"></div>
    <div id="note"></div>
    <div style="margin-top:8px">打开的是本机固定地址，断网也能用；建议「添加到主屏幕」。</div>
  </div>
</div>

<script>
(function () {
  var el = function (id) { return document.getElementById(id); };
  var S = {
    info: null, question: null, index: 0, total: 0, results: [],
    picked: [], locked: false, busy: false, answered: false,
    next: null, tier: 0, timer: null, target: null, targetName: '',
    cdTimer: null, clockSkew: 0, schTimer: null, focus: []
  };
  var LETTERS = 'ABCDEFGH';

  function showPanel(kind, title, html) {
    var p = el('result');
    p.className = 'panel ' + kind;
    p.innerHTML = '';
    var h = document.createElement('h2');
    h.textContent = title;
    p.appendChild(h);
    if (html) {
      var box = document.createElement('div');
      box.innerHTML = html;
      p.appendChild(box);
    }
    p.style.display = 'block';
  }
  function hidePanel() {
    stopCountdown();
    el('result').style.display = 'none';
    el('result').className = 'panel';
  }
  function setMain(text, enabled) {
    var b = el('main');
    b.textContent = text;
    b.disabled = !enabled;
    b.style.display = 'block';
  }
  function hideMain() { el('main').style.display = 'none'; }
  function showQuiz(show) {
    el('quiz').style.display = show ? 'block' : 'none';
    el('loading').style.display = show ? 'none' : 'block';
    el('progress').style.display = show ? 'flex' : 'none';
    if (!show) hideMain();
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function hhmm(ts) {
    if (!ts) return '';
    var d = new Date(ts * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  // ---------- 到期倒计时 ----------

  function pad2(n) { return ('0' + n).slice(-2); }

  function fmtLeft(sec) {
    var s = Math.max(0, Math.floor(sec));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return (h ? h + ':' + pad2(m) : pad2(m)) + ':' + pad2(r);
  }

  function stopCountdown() {
    if (S.cdTimer) { clearInterval(S.cdTimer); S.cdTimer = null; }
  }

  // 以服务端时间为准做倒计时（手机时钟不准也不会算错）；到 0 后服务端最长 20s 内回收
  function startCountdown(expireAt, serverNow) {
    stopCountdown();
    if (serverNow) S.clockSkew = Date.now() / 1000 - serverNow;
    function now() { return Date.now() / 1000 - S.clockSkew; }
    function tick() {
      var box = el('cd');
      if (!box) { stopCountdown(); return; }
      var left = expireAt - now();
      if (left > 0) {
        box.className = 'cd';
        box.innerHTML = '还剩 <b>' + fmtLeft(left) + '</b> 自动断网';
        return;
      }
      box.className = 'cd over';
      box.textContent = '时间到，正在断网…';
      stopCountdown();
      setTimeout(loadInfo, 3000);
    }
    tick();
    S.cdTimer = setInterval(tick, 1000);
  }

  // ---------- 设备状态 ----------

  function renderStatus(info) {
    var box = el('status');
    box.style.display = 'flex';
    box.innerHTML = '';
    if (!info.need) { box.style.display = 'none'; return; }
    var left = info.remaining_minutes;
    var txt;
    if (left === null) txt = '<b>已永久放行</b>';
    else if (left > 0) txt = '当前还能上网 <b>' + left + '</b> 分钟';
    else txt = '<span class="pill off">已断网</span> 答题后即可恢复';
    box.innerHTML = txt;
    if (info.today_minutes > 0 || info.daily_cap_minutes > 0) {
      var pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = info.daily_cap_minutes
        ? '今日已得 ' + info.today_minutes + ' / ' + info.daily_cap_minutes + ' 分钟'
        : '今日已得 ' + info.today_minutes + ' 分钟';
      box.appendChild(pill);
    }
  }

  function label(t) {
    if (!t) return '';
    if (t.name) return t.name;
    return t.mac ? t.mac.slice(-8) : '';
  }

  function renderTargets(info) {
    var list = info.targets || [];
    var box = el('targets');
    box.innerHTML = '';
    el('target-wrap').style.display = list.length > 1 ? 'block' : 'none';
    if (!list.length) return;

    list.forEach(function (t) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'dev' + (t.mac === S.target ? ' on' : '');
      b.textContent = label(t) + (t.is_self ? '（本机）' : '');
      if (t.remaining_minutes > 0) {
        var s = document.createElement('small');
        s.textContent = '剩 ' + t.remaining_minutes + ' 分';
        b.appendChild(s);
      }
      var sch = t.schedule || {};
      if (sch.limited && !sch.allowed) {
        var no = document.createElement('small');
        no.textContent = '当前不可答题';
        b.appendChild(no);
      }
      b.onclick = function () {
        S.target = t.mac;
        S.targetName = label(t);
        renderTargets(info);
        renderTiers(t);
        if (sch.limited && !sch.allowed) {
          el('pick-card').style.display = 'none';
          showPanel('info', '这台设备现在不是答题时间',
            '<p>' + esc(sch.hint || '') + '</p>');
        } else {
          el('result').style.display = 'none';
        }
      };
      box.appendChild(b);
    });
  }

  function ruleOf(t) {
    // 3.12.0：放行规则按题库配置，优先用所选设备的题库规则
    return (t && t.pass_rule) || (S.info && S.info.pass_rule) || {};
  }

  function passRuleText(t) {
    var rule = ruleOf(t);
    if (rule.mode === 'strict')
      return '一轮全部答对才生效，答错一道要重来。';
    var rate = rule.rate || 80, add = rule.add || 0;
    return (add > 0
      ? '答错一题当场加做 ' + add + ' 题，'
      : '答错不扣分也不加题，') + '本轮正确率达到 ' + rate + '% 就放行。';
  }

  function limitText(t) {
    // 3.14.0：限制方式可能是「限速」而不是断网
    var r = (t && t.limit_rule) || (S.info && S.info.limit_rule) || {};
    if (r.mode !== 'throttle') return '';
    return '当前是限速模式：答对后解除限速 ' + (r.kbps || 20) + ' KB/s 的限速。';
  }

  function renderTiers(t) {
    var box = el('tiers');
    box.innerHTML = '';
    var bankName = t.bank ? t.bank.name : '';
    el('pick-title').textContent = bankName ? bankName + ' · 选一个目标开始答题'
                                           : '选一个目标开始答题';
    var who = S.target ? '答对后将放行「' + label(t) + '」。' : '';
    el('pick-desc').textContent = who + passRuleText(t) + ' ' + limitText(t);
    var rule = ruleOf(t);
    (t.tiers || []).forEach(function (tier, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tier';
      var num = document.createElement('div');
      num.className = 'num';
      num.innerHTML = tier.questions + '<small>道题</small>';
      var txt = document.createElement('div');
      txt.className = 'txt';
      var b1 = document.createElement('b');
      b1.textContent = tier.minutes === 0 ? '一直可以上网' : tier.minutes + ' 分钟';
      var s1 = document.createElement('span');
      s1.textContent = tier.minutes === 0 ? '答对就长期有效'
        : (rule.mode === 'strict' ? '答对 ' + tier.questions + ' 道全部正确'
                                  : '正确率 ≥ ' + (rule.rate || 80) + '% 即可放行');
      txt.appendChild(b1); txt.appendChild(s1);
      var go = document.createElement('div');
      go.className = 'go';
      go.textContent = '开始 ›';
      b.appendChild(num); b.appendChild(txt); b.appendChild(go);
      b.onclick = function () { startTier(i); };
      box.appendChild(b);
    });
    el('pick-card').style.display = 'block';
  }

  function renderProgress() {
    var box = el('progress');
    box.innerHTML = '';
    for (var i = 0; i < S.total; i++) {
      var d = document.createElement('span');
      d.className = 'dot';
      if (S.results[i] === true) d.className += ' ok';
      else if (S.results[i] === false) d.className += ' no';
      else if (i === S.index) d.className += ' now';
      box.appendChild(d);
    }
    var c = document.createElement('span');
    c.className = 'pcount';
    c.textContent = '第 ' + Math.min(S.index + 1, S.total) + ' / ' + S.total + ' 题';
    box.appendChild(c);
  }

  function renderChips(q) {
    var box = el('chips');
    box.innerHTML = '';
    var items = [];
    if (q.stage) items.push(q.stage + (q.grade ? ' · ' + q.grade : ''));
    if (q.subject) items.push(q.subject);
    if (q.type === 'multi') items.push('多选');
    else if (q.type === 'judge') items.push('判断');
    else items.push('单选');
    if (q.topic) items.push(q.topic);
    items.forEach(function (t, i) {
      var s = document.createElement('span');
      s.className = 'chip' + (i === 0 && q.stage ? '' : ' plain');
      s.textContent = t;
      box.appendChild(s);
    });
    if (q.star) {
      var st = document.createElement('span');
      st.className = 'chip star';
      st.textContent = '难度 ' + new Array(Math.max(1, Math.min(5, q.star)) + 1).join('★');
      box.appendChild(st);
    }
    if (S.index === 0 && S.focus && S.focus.length) {
      var f = document.createElement('span');
      f.className = 'chip focus';
      f.textContent = '本轮重点练习：' + S.focus.join('、');
      box.appendChild(f);
    }
  }

  function renderOptions(q) {
    var box = el('options');
    box.innerHTML = '';
    S.picked = [];
    var multi = q.type === 'multi';
    q.options.forEach(function (text, idx) {
      var row = document.createElement('div');
      row.className = 'opt';
      row.dataset.idx = String(idx);
      var mark = document.createElement('div');
      mark.className = 'mark';
      mark.textContent = LETTERS[idx];
      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = text;
      row.appendChild(mark);
      row.appendChild(label);
      row.onclick = function () {
        if (S.answered || S.locked) return;
        if (multi) {
          var at = S.picked.indexOf(idx);
          if (at >= 0) S.picked.splice(at, 1); else S.picked.push(idx);
        } else {
          S.picked = [idx];
        }
        Array.prototype.forEach.call(box.children, function (n, i) {
          n.classList.toggle('picked', S.picked.indexOf(i) >= 0);
        });
        setMain('确认答案', S.picked.length > 0);
      };
      box.appendChild(row);
    });
    setMain('确认答案', false);
  }

  function renderQuestion(payload) {
    S.question = payload.question;
    S.index = payload.index;
    S.total = payload.total;
    if (payload.focus) S.focus = payload.focus;
    S.results = payload.results || [];
    S.next = null;
    S.answered = false;
    S.busy = false;
    hidePanel();
    el('pick-card').style.display = 'none';
    showQuiz(true);
    el('main').onclick = submit;
    renderProgress();
    renderChips(S.question);
    el('qtext').textContent = S.question.text;
    el('feedback').className = 'feedback';
    el('feedback').textContent = '';
    renderOptions(S.question);
  }

  function markAnswer(picked, answer) {
    var correctSet = Array.isArray(answer) ? answer : [answer];
    Array.prototype.forEach.call(el('options').children, function (n, i) {
      n.classList.add('locked');
      n.classList.remove('picked');
      if (correctSet.indexOf(i) >= 0) n.classList.add('correct');
      else if (picked.indexOf(i) >= 0) n.classList.add('wrong');
    });
    S.answered = true;
  }

  function showFeedback(ok, explain, answer) {
    var fb = el('feedback');
    fb.className = 'feedback on ' + (ok ? 'ok' : 'no');
    fb.innerHTML = '';
    var b = document.createElement('b');
    b.textContent = ok ? '答对了' : '答错了';
    fb.appendChild(b);
    var p = document.createElement('p');
    var right = Array.isArray(answer)
      ? answer.map(function (i) { return LETTERS[i]; }).join('、')
      : LETTERS[answer];
    p.textContent = (ok ? '' : '正确答案：' + right + '。') + (explain || '');
    fb.appendChild(p);
    markAnswer(S.picked, answer);
  }

  function startLock(seconds) {
    S.locked = true;
    showQuiz(false);
    el('pick-card').style.display = 'none';
    var left = seconds;
    function tick() {
      if (left <= 0) {
        clearInterval(S.timer);
        S.locked = false;
        hidePanel();
        loadInfo();
        return;
      }
      showPanel('no', '答题暂停', '<p>答错次数太多，请等 <b>' + left +
        '</b> 秒后再试。</p>');
      left -= 1;
    }
    tick();
    S.timer = setInterval(tick, 1000);
  }

  // ---------- 流程 ----------

  // 时段翻转时自动重查：孩子开着页面等到开放时间，不用手动刷新
  function scheduleAutoRefresh(sch) {
    if (S.schTimer) { clearTimeout(S.schTimer); S.schTimer = null; }
    if (!sch || !sch.change_at) return;
    var delay = (sch.change_at - (Date.now() / 1000 - S.clockSkew)) * 1000 + 1500;
    if (delay < 1000) delay = 1000;
    if (delay > 2147483647) return;
    S.schTimer = setTimeout(loadInfo, delay);
  }

  function loadInfo() {
    if (S.schTimer) { clearTimeout(S.schTimer); S.schTimer = null; }
    hidePanel();
    showQuiz(false);
    el('pick-card').style.display = 'none';
    el('loading').textContent = '正在读取题目…';
    el('loading').style.display = 'block';
    fetch('/api/quiz', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        S.info = data;
        if (data.server_now) S.clockSkew = Date.now() / 1000 - data.server_now;
        scheduleAutoRefresh(data.schedule);
        el('devinfo').textContent = '本机地址：' + (data.ip || '');
        el('note').textContent = data.note || '';
        el('loading').style.display = 'none';
        if (data.reason === 'router_error') {
          showPanel('no', '读不到路由器', '<p>请确认 NAS 与路由器在同一网络，或稍后刷新重试。</p>');
          return;
        }
        if (!data.ok) {
          showPanel('no', '出错了', '<p>' + esc(data.detail || '请刷新页面') + '</p>');
          return;
        }
        if (data.locked_for > 0) { startLock(data.locked_for); return; }
        // 设备设了答题时段：时段外不展示题目，直接说明下次开放时间
        if (data.schedule && data.schedule.limited && !data.schedule.allowed) {
          showPanel('info', '现在不是答题时间',
            '<p>' + esc(data.schedule.hint || '当前时段不能通过答题放行。') + '</p>' +
            '<p style="font-size:12.5px;color:#6b7280">' +
            esc(data.schedule.summary || '') + '</p>');
          return;
        }
        var list = data.targets || [];
        if ((!data.need && !data.pick_target) || !list.length) {
          showPanel('info', '这台设备不用答题',
            '<p>' + esc(data.message || '它不在管理员设定的受控清单里。') + '</p>');
          return;
        }
        var self = null;
        list.forEach(function (t) { if (t.is_self) self = t; });
        var chosen = self || list[0];
        S.target = chosen.mac;
        S.targetName = label(chosen);
        renderStatus(data);
        if (data.pick_target) el('status').style.display = 'none';
        renderTargets(data);
        renderTiers(chosen);
        var blocked = chosen.schedule && chosen.schedule.limited &&
                      !chosen.schedule.allowed;
        if (list.length === 1 && (chosen.tiers || []).length === 1 && !blocked) startTier(0);
        if (blocked) {
          showQuiz(false);
          el('pick-card').style.display = 'none';
          showPanel('info', '这台设备现在不是答题时间',
            '<p>' + esc(chosen.schedule.hint || '') + '</p>');
        }
      })
      .catch(function () {
        el('loading').style.display = 'block';
        el('loading').textContent = '无法连接到答题服务，请确认已连上家里 Wi-Fi 后刷新页面。';
      });
  }

  function startTier(tier) {
    if (S.busy) return;
    S.busy = true;
    S.tier = tier;
    el('pick-card').style.display = 'none';
    el('loading').style.display = 'block';
    el('loading').textContent = '正在出题…';
    fetch('/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ tier: tier, target: S.target || '' })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, data: j }; });
    }).then(function (res) {
      var d = res.data || {};
      S.busy = false;
      if (res.status === 429 || d.reason === 'locked') { startLock(d.seconds || 60); return; }
      if (d.reason === 'daily_cap') {
        showPanel('info', '今天的额度用完了', '<p>' + esc(d.detail || '') + '</p>');
        return;
      }
      if (d.reason === 'outside_schedule') {
        showQuiz(false);
        showPanel('info', '现在不是答题时间', '<p>' + esc(d.detail || '') + '</p>');
        return;
      }
      if (d.reason === 'not_managed') {
        showPanel('info', '这台设备不用答题', '<p>它不在管理员设定的受控清单里。</p>');
        return;
      }
      if (d.reason === 'router_error') {
        showPanel('no', '读不到路由器', '<p>' + esc(d.detail || '') + '</p>');
        return;
      }
      if (!d.ok) {
        showPanel('no', '出题失败', '<p>' + esc(d.detail || '请刷新页面重试') + '</p>');
        return;
      }
      renderQuestion(d);
    }).catch(function () {
      S.busy = false;
      showPanel('no', '出题失败', '<p>网络似乎断了，请刷新页面重试。</p>');
    });
  }

  function submit() {
    if (S.busy || S.answered || !S.question || S.picked.length === 0) return;
    S.busy = true;
    setMain('正在判卷…', false);
    fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ id: S.question.id, choices: S.picked })
    }).then(function (r) {
      return r.json().then(function (j) { return { status: r.status, data: j }; });
    }).then(function (res) {
      var d = res.data || {};
      S.busy = false;
      if (res.status === 429 || d.reason === 'locked') { startLock(d.seconds || 60); return; }
      if (d.reason === 'stale') { loadInfo(); return; }
      if (d.reason === 'daily_cap') {
        showQuiz(false);
        showPanel('info', '今天的额度用完了', '<p>' + esc(d.detail || '') + '</p>');
        return;
      }
      if (d.reason === 'outside_schedule') {
        showQuiz(false);
        showPanel('info', '答案对了，但已过答题时间',
          '<p>' + esc(d.detail || '现在不能放行，请在允许的时段内重新答题。') + '</p>');
        return;
      }
      if (d.reason === 'not_managed') {
        showQuiz(false);
        showPanel('info', '这台设备不用答题', '<p>它不在管理员设定的受控清单里。</p>');
        return;
      }
      if (d.reason === 'router_error') {
        showQuiz(false);
        showPanel('no', '答案对了，但放行失败',
          '<p>请管理员在小米 WiFi App 里手动允许本机联网，或查看服务日志。</p>');
        return;
      }
      if (!d.ok) { setMain('确认答案', true); return; }

      S.results = d.results || S.results;
      S.index = d.index;
      if (d.total) S.total = d.total;   // 答错加题后本轮总数会变大
      showFeedback(d.correct, d.explain, d.answer);
      renderProgress();

      if (!d.done) {
        if (d.added_questions > 0) {
          var addNote = document.createElement('p');
          addNote.textContent = '答错了，本轮加做 ' + d.added_questions +
            ' 题，一共 ' + d.total + ' 题。';
          el('feedback').appendChild(addNote);
        }
        S.next = d.question;
        setMain('下一题', true);
        el('main').onclick = nextQuestion;
        return;
      }

      if (d.all_correct) {
        showQuiz(false);
        var left = d.remaining_minutes;
        var leftText = left === null ? '一直有效'
          : (left > 0 ? '可用 ' + left + ' 分钟' : '');
        var extra = d.expire_at
          ? '<p>到 ' + hhmm(d.expire_at) + ' 自动断开，到时再答一次即可。</p>' +
            '<div class="cd" id="cd"></div>'
          : '<p>不会再自动断开。</p>';
        var rateMode = d.pass_mode === 'rate';
        var accLine = rateMode && d.accuracy_percent < 100
          ? '<p style="margin-top:4px">本轮正确率 ' + d.accuracy_percent +
            '%，达到 ' + d.pass_rate_percent + '% 的要求。</p>' : '';
        showPanel('ok',
          rateMode && d.accuracy_percent < 100
            ? (S.targetName
                ? '正确率 ' + d.accuracy_percent + '% 达标，「' + S.targetName + '」已放行'
                : '正确率 ' + d.accuracy_percent + '% 达标，已放行')
            : (S.targetName ? '全部答对，「' + S.targetName + '」已放行'
                            : '全部答对，已放行'),
          '<div class="big">' + (d.minutes ? '+' + d.minutes + ' 分钟' : '已开网') + '</div>' +
          '<p>' + esc(d.message || '') + '（' + leftText + '）</p>' + accLine + extra +
          (d.today_minutes ? '<p style="margin-top:6px">今日累计获得 ' +
            d.today_minutes + ' 分钟。</p>' : ''));
        if (d.expire_at) startCountdown(d.expire_at, d.now);
        return;
      }

      showQuiz(false);
      if (d.locked_for > 0) { startLock(d.locked_for); return; }
      if (d.pass_mode === 'rate') {
        showPanel('no', '这一轮没达标',
          '<p>本轮正确率 ' + d.accuracy_percent + '%，需要 ≥ ' +
            d.pass_rate_percent + '%，需要重新答一轮。' +
            (d.remain > 0 ? '还剩 ' + d.remain + ' 次机会。' : '') + '</p>');
      } else {
        showPanel('no', '这一轮有错题',
          '<p>答错 ' + (d.total - d.results.filter(Boolean).length) + ' 题，需要重新答一轮。' +
            (d.remain > 0 ? '还剩 ' + d.remain + ' 次机会。' : '') + '</p>');
      }
      setMain('再来一轮', true);
      el('main').onclick = function () { startTier(d.tier || 0); };
    }).catch(function () {
      showPanel('no', '提交失败', '<p>网络似乎断了，请刷新页面重试。</p>');
      setMain('重试', true);
      el('main').onclick = loadInfo;
      S.busy = false;
    });
  }

  function nextQuestion() {
    if (!S.next) { loadInfo(); return; }
    var payload = { question: S.next, index: S.index, total: S.total, results: S.results };
    el('main').onclick = submit;
    renderQuestion(payload);
  }

  el('main').onclick = submit;
  loadInfo();
})();
</script>
