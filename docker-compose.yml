services:
  wifi-gate:
    build: .
    image: wifi-gate:local
    container_name: wifi-gate

    # 关键：必须用 host 网络。bridge 模式下容器看到的来源 IP 是 Docker 网关，
    # 无法反查手机真实 MAC，且 /proc/net/arp 里只有网关，放行会指向错设备。
    # host 模式下 ports: 会被忽略，端口由 config.json 的 server.port 决定。
    network_mode: host

    restart: unless-stopped
    stop_grace_period: 10s

    environment:
      TZ: Asia/Shanghai
      # NAS 上若 state 目录写不进去，把这两个值改成宿主机目录属主的 uid/gid
      PUID: "1000"
      PGID: "1000"
      # 配置文件放在挂载目录内。首次启动时 /setup 要把密码写回这里，
      # 所以不能再用单文件只读挂载（那样引导模式存不下配置）。
      WIFIGATE_CONFIG: /config/config.json

    volumes:
      # 配置目录（可写）：含路由器密码与后台密码，宿主权限建议 700
      - ./config:/config
      - ./state:/app/state

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
